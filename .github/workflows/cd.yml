name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        required: false
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_base_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_k8s_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_gateway_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: "true"
  # Structurally valid and nonexistent CPF: the credential refusal is the
  # answer that proves the whole chain without relying on real data.
  SYNTHETIC_CPF: "123.456.789-09"
  SYNTHETIC_PASSWORD: "SenhaSinteticaDeVerificacao"

jobs:
  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    environment: production
    outputs:
      function_name: ${{ steps.tf.outputs.function_name }}
      api_endpoint: ${{ steps.tf.outputs.api_endpoint }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.ENABLE_DEPLOY == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate required secrets
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        env:
          CUSTOMER_JWT_PRIVATE_KEY: ${{ secrets.CUSTOMER_JWT_PRIVATE_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          ENABLE_TELEMETRY_COLLECTION: ${{ vars.ENABLE_TELEMETRY_COLLECTION }}
        run: |
          set -euo pipefail

          if [ -z "${CUSTOMER_JWT_PRIVATE_KEY}" ]; then
            echo "::error::CUSTOMER_JWT_PRIVATE_KEY não está configurado nos segredos do environment production."
            exit 1
          fi

          printf '%s' "${CUSTOMER_JWT_PRIVATE_KEY}" > /tmp/customer-auth-private.pem
          if ! openssl pkey -in /tmp/customer-auth-private.pem -noout >/dev/null 2>&1; then
            echo "::error::CUSTOMER_JWT_PRIVATE_KEY não tem forma de chave privada PEM legível."
            exit 1
          fi

          # Collection is optional, but turning it on without a credential would produce
          # an attached layer that delivers nothing.
          if [ "${ENABLE_TELEMETRY_COLLECTION}" = "true" ] && [ -z "${DD_API_KEY}" ]; then
            echo "::error::DD_API_KEY não está configurado nos segredos do environment production, mas ENABLE_TELEMETRY_COLLECTION está ligada."
            exit 1
          fi

          echo "Segredos exigidos presentes e bem formados."

      - uses: ./.github/actions/setup-ci

      - name: Build
        working-directory: app
        run: npm run build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -no-color -backend-config="bucket=$TF_STATE_BUCKET"
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: infra

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        working-directory: infra
        env:
          TF_VAR_service_version: ${{ github.sha }}
          TF_VAR_enable_telemetry_collection: ${{ vars.ENABLE_TELEMETRY_COLLECTION == 'true' }}
          TF_VAR_telemetry_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        working-directory: infra
        env:
          TF_VAR_service_version: ${{ github.sha }}
          TF_VAR_enable_telemetry_collection: ${{ vars.ENABLE_TELEMETRY_COLLECTION == 'true' }}
          TF_VAR_telemetry_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform apply -auto-approve -no-color

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        working-directory: infra
        env:
          TF_VAR_service_version: ${{ github.sha }}
          TF_VAR_enable_telemetry_collection: ${{ vars.ENABLE_TELEMETRY_COLLECTION == 'true' }}
          TF_VAR_telemetry_api_key: ${{ secrets.DD_API_KEY }}
        run: terraform destroy -auto-approve -no-color

      - name: Read stack outputs
        id: tf
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        working-directory: infra
        run: |
          set -euo pipefail
          {
            echo "function_name=$(terraform output -raw function_name)"
            echo "function_version=$(terraform output -raw function_version)"
            echo "jwt_private_key_secret_arn=$(terraform output -raw jwt_private_key_secret_arn)"
            echo "api_endpoint=$(terraform output -raw api_endpoint)"
          } >> "$GITHUB_OUTPUT"

      # The infrastructure declares the secret container; the **value** is written
      # here, so the key material does not pass through the state.
      - name: Write the signing key value idempotently
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        env:
          CUSTOMER_JWT_PRIVATE_KEY: ${{ secrets.CUSTOMER_JWT_PRIVATE_KEY }}
          SECRET_ARN: ${{ steps.tf.outputs.jwt_private_key_secret_arn }}
        run: |
          set -euo pipefail
          printf '%s' "${CUSTOMER_JWT_PRIVATE_KEY}" > /tmp/customer-auth-private.pem
          token="$(sha256sum /tmp/customer-auth-private.pem | cut -d' ' -f1)"

          aws secretsmanager put-secret-value \
            --secret-id "${SECRET_ARN}" \
            --secret-string "file:///tmp/customer-auth-private.pem" \
            --client-request-token "${token}" \
            --output json > /tmp/put-secret-value.json

          rm -f /tmp/customer-auth-private.pem
          echo "Versão corrente do segredo: $(jq -r '.VersionId' /tmp/put-secret-value.json)"

      - name: Record the deployment in the job summary
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
        run: |
          {
            echo '### Entrega'
            echo ''
            echo "- Função: \`${{ steps.tf.outputs.function_name }}\`"
            echo "- Versão publicada: \`${{ steps.tf.outputs.function_version }}\`"
            echo "- Commit implantado: \`${{ github.sha }}\`"
            echo "- Coleta de telemetria: \`${{ vars.ENABLE_TELEMETRY_COLLECTION == 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  post-deploy-gates:
    name: Post-Deploy Gates
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    permissions:
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # First gate: the direct invocation proves, in a chain, that the package
      # loads, the configuration is valid, both secrets were read, the key
      # imported and the network interface reaches the database.
      #
      # The discrimination comes from the response translator: 401 = database reached
      # with no match; 503 = the database operation failed; 500 = configuration or
      # signing; no response = package or network.
      - name: Post-deploy gate — real invocation
        env:
          FUNCTION_NAME: ${{ needs.deploy.outputs.function_name }}
        run: |
          set -euo pipefail

          jq -n \
            --arg cpf "${SYNTHETIC_CPF}" \
            --arg password "${SYNTHETIC_PASSWORD}" \
            '{
              version: "2.0",
              routeKey: "POST /customer-auth/login",
              rawPath: "/customer-auth/login",
              rawQueryString: "",
              headers: { "content-type": "application/json", "x-request-id": "post-deploy-gate" },
              requestContext: {
                http: { method: "POST", path: "/customer-auth/login", protocol: "HTTP/1.1", sourceIp: "127.0.0.1", userAgent: "cd-gate" },
                requestId: "post-deploy-gate",
                routeKey: "POST /customer-auth/login",
                stage: "$default"
              },
              body: ({ cpf: $cpf, password: $password } | tostring),
              isBase64Encoded: false
            }' > /tmp/gate-event.json

          aws lambda invoke \
            --function-name "${FUNCTION_NAME}" \
            --cli-binary-format raw-in-base64-out \
            --payload "file:///tmp/gate-event.json" \
            --output json \
            /tmp/gate-response.json > /tmp/gate-metadata.json

          echo "Metadados da invocação:"; cat /tmp/gate-metadata.json
          echo "Resposta:"; cat /tmp/gate-response.json

          if jq -e '.FunctionError' /tmp/gate-metadata.json > /dev/null 2>&1; then
            echo "::error::A invocação não produziu resposta da aplicação — pacote ou rede quebrados."
            exit 1
          fi

          status="$(jq -r '.statusCode // empty' /tmp/gate-response.json)"
          case "${status}" in
            401) echo "Portão 1 aprovado: a função recusou a credencial." ;;
            503) echo "::error::A função respondeu indisponibilidade: a operação no banco falhou. A causa — rede, credencial ou schema — está na linha db.query.failed do log da função."; exit 1 ;;
            500) echo "::error::A função respondeu erro interno — configuração inválida ou falha de assinatura."; exit 1 ;;
            "")  echo "::error::A invocação não produziu resposta da aplicação — pacote ou rede quebrados."; exit 1 ;;
            *)   echo "::error::A função respondeu ${status}, e o portão exige 401."; exit 1 ;;
          esac

      # Final gate: the only link the direct invocation does not exercise is the
      # invoke permission granted to the API Gateway — precisely the link whose
      # absence makes the public route answer an integration error while the function
      # exists and is healthy.
      #
      # The route declares no authorizer of its own, so a credential refusal here
      # can only have come from the function.
      - name: Post-deploy gate — public route
        env:
          API_ENDPOINT: ${{ needs.deploy.outputs.api_endpoint }}
        run: |
          set -euo pipefail

          body="$(jq -nc --arg cpf "${SYNTHETIC_CPF}" --arg password "${SYNTHETIC_PASSWORD}" '{ cpf: $cpf, password: $password }')"

          status="$(curl -sS -o /tmp/route-response.json -w '%{http_code}' \
            -X POST "${API_ENDPOINT}/customer-auth/login" \
            -H 'content-type: application/json' \
            -d "${body}")"

          echo "Resposta da rota pública (${status}):"; cat /tmp/route-response.json

          if [ "${status}" != "401" ]; then
            echo "::error::A rota pública respondeu ${status}, e o portão exige 401. Um erro de integração aqui, com a invocação direta aprovada, aponta a autorização de invocação concedida ao API Gateway."
            exit 1
          fi

          echo "Portão 2 aprovado: a rota pública é atendida pela função."
