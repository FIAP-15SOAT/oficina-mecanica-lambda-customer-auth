name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  API_REPOSITORY: FIAP-15SOAT/oficina-mecanica-api
  API_MIGRATOR_COMMIT: 84af3af171cbacf04f63994577633667c97c91b9
  API_MIGRATOR_IMAGE: techchallenge-api:local
  # Limite de envio direto do pacote compactado, em bytes (50 MiB).
  PACKAGE_SIZE_LIMIT_BYTES: "52428800"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      - name: Lint
        working-directory: app
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      # Job próprio porque a construção é esbuild, que **apaga anotações de tipo
      # sem verificá-las**. Sem esta verificação um erro de tipo é empacotado e
      # publicado.
      - name: Type check
        working-directory: app
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      # O limiar de 100% nas quatro métricas vive em jest.config.ts: cobertura
      # abaixo dele reprova aqui.
      - name: Unit tests with coverage
        working-directory: app
        run: npm run test:cov

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci

      - name: Check out the API repository at the pinned commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.API_REPOSITORY }}
          ref: ${{ env.API_MIGRATOR_COMMIT }}
          path: .api-source

      - name: Build the migrator image from source
        working-directory: .api-source/app
        run: docker build -t "${API_MIGRATOR_IMAGE}" .

      - name: E2E tests against the API-owned schema
        working-directory: app
        run: npm run test:e2e

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci

      - name: Build
        working-directory: app
        run: npm run build

      # O carregamento acontece **fora da árvore do repositório**: a resolução
      # de módulos sobe pelos diretórios ancestrais e encontraria as
      # dependências instaladas do projeto, transformando a asserção em teatro.
      #
      # `pg-native` continua externo e continua não sendo resolvido aqui, porque
      # o driver só o referencia atrás de um acessor preguiçoso que esta função
      # nunca toca.
      - name: Load the entry point with no dependencies installed
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "${GITHUB_WORKSPACE}/app/dist/handler.js" "${staging}/handler.js"
          cd "${staging}"
          node -e "
            const loaded = require('./handler.js');
            if (typeof loaded.handler !== 'function') {
              throw new Error('O ponto de entrada não expõe a função de tratamento.');
            }
            console.log('O ponto de entrada carrega sem dependências e expõe a função de tratamento.');
          "

      - name: Check the package against the direct upload limit
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          (cd "${GITHUB_WORKSPACE}/app/dist" && zip -q -r -X "${staging}/handler.zip" .)
          size="$(stat -c %s "${staging}/handler.zip")"
          echo "Pacote compactado: ${size} bytes (limite ${PACKAGE_SIZE_LIMIT_BYTES})."
          if [ "${size}" -gt "${PACKAGE_SIZE_LIMIT_BYTES}" ]; then
            echo "::error::O pacote excede o limite de envio direto da plataforma."
            exit 1
          fi

  tf-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init Lambda Customer Auth
        run: terraform init -backend=false -no-color
        working-directory: terraform

      - name: Terraform Validate Lambda Customer Auth
        run: terraform validate -no-color
        working-directory: terraform

      - uses: ./.github/actions/setup-ci

      - name: Build the package for the plan
        working-directory: app
        run: npm run build

      - name: Configure AWS Credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Plan Lambda Customer Auth
        if: steps.aws_creds.outcome == 'success'
        working-directory: terraform
        run: |
          terraform init -reconfigure -no-color
          terraform plan -no-color

      - name: Note skipped plan in job summary
        if: steps.aws_creds.outcome == 'failure'
        run: |
          {
            echo '### Terraform plan — skipped ⏭️'
            echo ''
            echo 'The target environment appears to be unavailable, so `terraform plan` was skipped. **This does not block CI** — `fmt` and `validate` passed. Re-run once the environment is back up to preview the plan.'
          } >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - unit-tests
      - e2e-tests
      - package
      - tf-validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Open a PR to main if none exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base main --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "An open PR already exists for ${HEAD_BRANCH} -> main; nothing to do."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "Automated PR opened by CI on behalf of @${ACTOR} after all checks passed on \`${HEAD_BRANCH}\`."
